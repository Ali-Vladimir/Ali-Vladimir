
<svg xmlns="http://www.w3.org/2000/svg"
     width="100%"
     viewBox="0 0 1200 340"
     fill="none">

  <rect width="1200" height="340" fill="#000000"/>

  <!-- Línea lateral -->
  <rect x="48" y="42" width="4" height="230" fill="#0097ff"/>

  <!-- Etiqueta superior -->
  <text x="78" y="76"
        fill="#beeafe"
        font-family="monospace"
        font-size="18"
        letter-spacing="3">
    SOFTWARE / ENGINEERING
  </text>

  <!-- Título principal -->
  <text x="78" y="142"
        fill="#eaf8ff"
        font-family="monospace"
        font-size="38"
        font-weight="700">
    Architectural precision
  </text>

  <text x="78" y="194"
        fill="#ABDEF5"
        font-family="monospace"
        font-size="38"
        font-weight="700">
    and end-to-end deployments.
  </text>

  <!-- Frase distintiva -->
  <text x="78" y="247"
        fill="#7dd3fc"
        font-family="monospace"
        font-size="30"
        font-weight="700">
    Above you,
    <tspan fill="#0ea5e9" font-weight="700">
      below zero.
    </tspan>
  </text>

  <!-- Detalle inferior -->
  <rect x="78" y="270" width="72" height="4" fill="#0097ff"/>

</svg>
